<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 / PS4 Exploit Host</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #58a6ff; }
        .box {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #2ea043; }
        .status-log {
            font-size: 14px;
            color: #8b949e;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>موقع التعديل والأوفلاين (Host)</h1>

    <div class="box">
        <h3>تعديل سوفت 9.00 (GoldHEN)</h3>
        <button onclick="loadExploit('900')">تشغيل الثغرة</button>
    </div>

    <div class="box">
        <h3>تعديل الإصدارات الحديثة (PSFree)</h3>
        <button onclick="loadExploit('psfree')">تشغيل الثغرة</button>
    </div>

    <div id="status" class="status-log">جاري التحقق من التخزين الأوفلاين...</div>
</div>

<script>
    // تسجيل الـ Service Worker للتخزين أوفلاين
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
            document.getElementById('status').innerText = 'تم تخزين الصفحة بنجاح! يمكنك الآن استخدامها بدون إنترنت (Offline).';
        })
        .catch(function(err) {
            document.getElementById('status').innerText = 'فشل التخزين الأوفلاين: ' + err;
        });
    }

    function loadExploit(type) {
        if (type === '900') {
            document.getElementById('status').innerText = 'جاري تشغيل ثغرة 9.00...';
            // استدعاء ملف الثغرة المحلي
            // window.location.href = 'payloads/900.html';
        } else if (type === 'psfree') {
            document.getElementById('status').innerText = 'جاري تشغيل ثغرة PSFree...';
            // window.location.href = 'payloads/psfree.html';
        }
    }
</script>

</body>
</html>
